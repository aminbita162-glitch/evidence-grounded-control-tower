services:
- type: web
  name: control-tower-production-web
  runtime: docker
  region: oregon
  plan: starter
  dockerfilePath: ./Dockerfile
  dockerCommand: python -m uvicorn deploy.env.__main__:create_web --factory --host
    0.0.0.0 --port 8000
  autoDeployTrigger: 'off'
  healthCheckPath: /api/v1/health
  preDeployCommand: python -m deploy.env migrate
  envVars:
  - key: CTC_ENVIRONMENT
    value: production
  - key: CTC_REGION
    value: oregon
  - key: CTC_DATABASE_URL
    sync: false
  - key: CTC_MIGRATION_DATABASE_URL
    sync: false
  - key: CTC_SESSION_KEY
    sync: false
  - key: CTC_API_TOKEN_RECORDS
    sync: false
- type: pserv
  name: control-tower-production-witness
  runtime: docker
  region: oregon
  plan: starter
  dockerfilePath: ./Dockerfile
  dockerCommand: python -m uvicorn deploy.env.__main__:create_witness --factory --host
    0.0.0.0 --port 8000
  autoDeployTrigger: 'off'
  disk:
    name: witness-state
    mountPath: /var/data
    sizeGB: 1
  envVars:
  - key: CTC_ENVIRONMENT
    value: production
  - key: CTC_REGION
    value: oregon
  - key: CTC_WITNESS_STATE
    value: /var/data/checkpoints.db
  - key: CTC_WITNESS_KEY
    sync: false
  - key: CTC_CHECKPOINT_PUBLIC_KEY
    sync: false
databases:
- name: control-tower-production-db
  region: oregon
  plan: 0.1c-256mb
  postgresMajorVersion: '18'
  ipAllowList: []
