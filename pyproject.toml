[project]
name = "amincustoms-control-tower"
version = "0.0.0"
description = "Evidence-grounded advisory pre-checks for customs and transit cases."
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary - All Rights Reserved" }

dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "jcs==0.3.0",
    "hypothesis==6.170.15",
    "mutmut==3.8.1",
    "import-linter==2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tools", "test-house"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tools/gate/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "A", "C4", "PIE", "SIM"]

[tool.ruff.lint.per-file-ignores]
"test-house/**" = ["S101", "S602", "S603", "S607"]
"tools/gate/**" = ["S602", "S603", "S607"]
"tools/schemagen/generator.py" = ["S603"]

[tool.mypy]
strict = true
disallow_any_explicit = true
python_version = "3.14"
exclude = ["tools/gate/fixtures/", "\\.venv/", "build/"]

[[tool.mypy.overrides]]
module = ["yaml", "jcs", "rfc8785"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tools.schemagen.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["kernel.contracts._generated.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["kernel.canonical.*", "kernel.hashing.*", "kernel.types.*", "kernel.ports.*", "kernel.casestate.*", "kernel.decision.*", "kernel.facts.*", "kernel.errors.*", "kernel.config.*"]
disallow_any_explicit = false

[tool.importlinter]
root_packages = ["kernel"]

[[tool.importlinter.contracts]]
name = "Kernel isolation"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = ["capabilities", "agents", "adapters", "views", "api"]

[tool.pytest.ini_options]
markers = [
    "fast: fast tests (at most 1 second per test)",
    "slow: slow tests (at most 30 seconds per test)",
    "e2e: end-to-end tests (at most 120 seconds per test)",
]
testpaths = ["test-house"]
pythonpath = ["."]
addopts = "--cov --cov-branch --cov-report=term-missing -n auto"
timeout = 30
