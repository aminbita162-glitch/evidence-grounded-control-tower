# P04 phase risk review — P04-RISK.
#
# P04 implemented the persistence and tenancy baseline: ephemeral PostgreSQL
# with three roles, a forward migration tool, entity tables generated from
# schemas with tenant_id and RLS, a tenant context requiring a principal,
# row-level security with deny-by-default policies, repositories in two
# implementations (in-memory and PostgreSQL), an atomic write path with
# outbox and idempotency, an append-only guard on evidence tables, a
# crash-consistency laboratory, and a threat-to-test matrix tool.
#
# Controls verified by the T-DB test suite:
#   - Cross-tenant read denied (T-DB-0019, T-DB-0021): RLS deny-by-default.
#   - Cross-tenant write denied (T-DB-0020, T-DB-0029): WITH CHECK policy.
#   - Session setting isolation (T-DB-0023): SET LOCAL does not leak.
#   - Partial write rollback (T-DB-0049): unit of work atomicity.
#   - Duplicate effects prevented (T-DB-0050, T-DB-0051): idempotency store.
#   - Append-only guard (T-DB-0061 to T-DB-0063): UPDATE/DELETE rejected.
#   - Migration lint (T-DB-0010, T-DB-0024, T-DB-0033): tenant_id, RLS, append-only.
#   - Crash recovery (T-DB-0069 to T-DB-0078): all kill points recover.

