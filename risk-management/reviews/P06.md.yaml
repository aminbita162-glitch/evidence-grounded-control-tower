# P06 phase risk review — P06-RISK.
#
# P06 implemented the rule engine: Pack DSL types and parser, pack
# validation and loading, reference interpreter, evaluator generator with
# differential tests, conflict resolution and result combination,
# metamorphic and performance gates, environment-perturbation determinism
# gate, and the Pack Authoring Kit.
#
# Controls verified by the T-RUL test suite:
#   - Non-determinism (T-RUL-0073 to T-RUL-0080): same case evaluated
#     under different locale, timezone, thread count, working directory
#     and insertion order gives identical hashes; subprocess determinism
#     verified.
#   - Evaluator divergence (T-RUL-0043 to T-RUL-0052): the reference
#     interpreter and the generated evaluator agree on all fixtures and
#     on 1,000 generated random fact sets; byte-identical regeneration
#     verified.
#   - Window errors (T-RUL-0027 to T-RUL-0030): window boundaries are
#     inclusive; rules outside their window are skipped with a reason.
#   - Silent skipping (T-RUL-0031, T-RUL-0042): absence of a finding is
#     recorded as NOT_APPLICABLE; every rule produces exactly one result.
#   - Floating-point leakage (T-RUL-0035): decimal arithmetic uses
#     Decimal, not float; 0.1 + 0.2 == 0.3 in Decimal.
#   - Missing facts (T-RUL-0032, T-RUL-0034): a missing or non-VERIFIED
#     fact gives ABSTAIN; rules read only VERIFIED facts.
#   - Conflicted facts (T-RUL-0033): a CONFLICTED fact gives ESCALATE
#     with both citations.
#   - Label ceiling (T-RUL-0019, T-RUL-0026, T-RUL-0056): a declared
#     label stronger than the weakest source is rejected; ALLOW is
#     impossible with a SECONDARY-or-weaker datum.
#   - Overlapping windows without precedence (T-RUL-0020, T-RUL-0025,
#     T-RUL-0058, T-RUL-0059): overlapping rules without precedence are
#     rejected; with precedence they are accepted.
#   - Forbidden constructs (T-RUL-0013): loops, recursion, I/O,
#     randomness, clock and user-defined functions are rejected with
#     stable error codes.
#   - Structural depth (T-RUL-0014): expressions exceeding the depth
#     bound are rejected, guaranteeing termination.
#   - Packkit integrity (T-RUL-0081 to T-RUL-0100): no kit command
#     raises a label or sets a source status to VERIFIED; simulate
#     leaves the case chain untouched.

