# P05 phase risk review — P05-RISK.
#
# P05 implemented the evidence ledger: case and system chains with gap-free
# sequence and hash chaining, Merkle tree (RFC 9162 style) with inclusion and
# consistency proofs, Ed25519 signed checkpoints with witness co-signatures
# and anchor port, cryptographic commitments (evaluation, proposal, salted
# field), offline verification (structural and full) with verification levels
# (SELF-ATTESTED, WITNESSED-LOCAL, WITNESSED-EXTERNAL, ANCHORED), replay
# from recorded inputs, a self-contained case bundle, and an independent
# verifier written in stdlib only.
#
# Controls verified by the T-LED test suite:
#   - Tamper detection (T-LED-0003, T-LED-0031, T-LED-0049, T-LED-0050,
#     T-LED-0060): every field change alters the record hash; a tampered
#     record or root is detected by structural verification.
#   - Gap-free sequence (T-LED-0001, T-LED-0002): concurrent appends produce
#     a gap-free sequence under the per-case lock.
#   - Append-only guard (T-LED-0005, T-LED-0006): UPDATE and DELETE are
#     rejected by the database trigger.
#   - Tenant isolation (T-LED-0007): RLS hides records from foreign tenants.
#   - Salted payload (T-LED-0008, T-LED-0009): different salts produce
#     different hashes; salt destroyed prevents confirmation.
#   - Cross-purpose replay (T-LED-0004, T-LED-0033, T-LED-0046): domain-
#     separated tags prevent hash reuse across purposes.
#   - Signature misuse (T-LED-0032, T-LED-0036): a tampered signature is
#     detected; a checkpoint without a co-signature is SELF-ATTESTED.
#   - Verifier divergence (T-LED-0067, T-LED-0068, T-LED-0073): the
#     independent verifier agrees with the kernel on valid and tampered
#     records across 50 random bundles.
#   - Salt loss (T-LED-0009, T-LED-0044): destroying the salt makes the
#     commitment unlinkable.

