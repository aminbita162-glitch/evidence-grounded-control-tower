<section id="k09" aria-labelledby="k09-title">
  <h2 id="k09-title">Duplicate-Document Shield</h2>
  <p data-outcome role="status"></p>
  <ul aria-label="Document coverage" data-coverage></ul>
  <table>
    <caption>Differing verified fields</caption>
    <thead><tr><th scope="col">Field</th><th scope="col">This document</th>
      <th scope="col">Related document</th></tr></thead>
    <tbody data-differences></tbody>
  </table>
  <template id="k09-finding">
    <article><h3><span aria-hidden="true" data-icon></span> <span data-finding></span></h3>
      <span data-other-case></span>
      <button type="button" data-declare-relation hidden>Declare relation</button>
    </article>
  </template>
</section>
