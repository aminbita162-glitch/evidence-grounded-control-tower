<section id="k14" aria-labelledby="k14-title">
  <h2 id="k14-title">Bilingual Intake</h2>
  <p data-status role="status"></p>
  <table>
    <caption>Extracted values in source order</caption>
    <thead><tr><th scope="col">Field</th><th scope="col">Original</th>
      <th scope="col">Normalized</th><th scope="col">Flags</th></tr></thead>

      <td><bdi dir="auto" data-normalized></bdi></td><td data-flags></td></tr>
  </template>
  <ul aria-label="Proposed name links" data-name-links></ul>
</section>
